<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1a3f"/>
      <stop offset="1" stop-color="#060f28"/>
    </linearGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b56a5c"/>
      <stop offset="1" stop-color="#9a4f44"/>
    </linearGradient>
    <linearGradient id="toothA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9dcb8"/>
      <stop offset="1" stop-color="#d4c39a"/>
    </linearGradient>
    <radialGradient id="gum" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#c0645f"/>
      <stop offset="1" stop-color="#a04a44"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- lips outer -->
  <path d="M120 300 C 200 180, 600 180, 680 300 C 640 470, 160 470, 120 300 Z" fill="url(#lip)" opacity="0.9"/>
  <!-- inner mouth -->
  <path d="M160 305 C 230 235, 570 235, 640 305 C 610 430, 190 430, 160 305 Z" fill="#6b2d27"/>

  <!-- upper gum line -->
  <path d="M180 300 C 250 250, 550 250, 620 300 C 620 308, 180 308, 180 300 Z" fill="url(#gum)" opacity="0.85"/>

  <!-- teeth: BEFORE — slightly yellow, one chipped, slight overlap, small gap -->
  <g>
    <!-- each tooth a rounded rect -->
    <rect x="195" y="300" width="58" height="78" rx="10" fill="url(#toothA)"/>
    <rect x="256" y="298" width="56" height="84" rx="10" fill="url(#toothA)"/>
    <!-- central gap -->
    <rect x="316" y="302" width="52" height="80" rx="10" fill="url(#toothA)"/>
    <rect x="374" y="300" width="54" height="86" rx="10" fill="url(#toothA)" transform="rotate(-4 401 343)"/>
    <rect x="432" y="299" width="56" height="82" rx="10" fill="url(#toothA)"/>
    <!-- chipped tooth -->
    <path d="M490 300 h56 v60 l-8 6 l-10 -10 l-12 12 l-8 -10 l-10 10 l-8 -8 z" fill="url(#toothA)"/>
    <rect x="552" y="302" width="50" height="78" rx="10" fill="url(#toothA)"/>
    <!-- slight stains -->
    <ellipse cx="224" cy="350" rx="14" ry="8" fill="#bca877" opacity="0.5"/>
    <ellipse cx="460" cy="360" rx="12" ry="7" fill="#bca877" opacity="0.5"/>
  </g>

  <!-- lower teeth faint -->
  <g opacity="0.55">
    <rect x="210" y="392" width="46" height="34" rx="8" fill="url(#toothA)"/>
    <rect x="262" y="392" width="48" height="34" rx="8" fill="url(#toothA)"/>
    <rect x="316" y="392" width="48" height="34" rx="8" fill="url(#toothA)"/>
    <rect x="370" y="392" width="48" height="34" rx="8" fill="url(#toothA)"/>
    <rect x="424" y="392" width="48" height="34" rx="8" fill="url(#toothA)"/>
    <rect x="478" y="392" width="48" height="34" rx="8" fill="url(#toothA)"/>
    <rect x="532" y="392" width="46" height="34" rx="8" fill="url(#toothA)"/>
  </g>

  <!-- label -->
  <text x="40" y="560" font-family="Georgia, serif" font-size="22" fill="#c9a878" letter-spacing="6">ANTES</text>
</svg>